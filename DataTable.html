<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Sortable Data Table</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f7fb;
      padding:40px 20px;
      color:#333;
    }

    .table-container{
      max-width:1100px;
      margin:auto;
      background:#fff;
      border-radius:12px;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);
      overflow-x:auto; /* Mobile horizontal scroll */
    }

    table{
      width:100%;
      min-width:700px;
      border-collapse:collapse;
    }

    thead{
      background:#007bff;
      color:#fff;
    }

    th, td{
      padding:16px 18px;
      text-align:left;
    }

    th{
      cursor:pointer;
      user-select:none;
      position:relative;
      transition:background 0.3s ease;
    }

    th:hover{
      background:#005fd1;
    }

    /* Alternate Row Colors */
    tbody tr:nth-child(even){
      background:#f8f9fc;
    }

    /* Hover Effect */
    tbody tr:hover{
      background:#eaf3ff;
      transition:0.3s ease;
    }

    td{
      border-bottom:1px solid #eee;
    }

    .sort-icon{
      margin-left:8px;
      font-size:0.8rem;
      opacity:0.7;
    }

    h1{
      text-align:center;
      margin-bottom:30px;
      font-size:2rem;
      color:#222;
    }

    /* Responsive */
    @media(max-width:768px){
      body{
        padding:20px 10px;
      }

      th, td{
        padding:14px;
        font-size:0.95rem;
      }
    }
  </style>
</head>
<body>

  <h1>Responsive Data Table</h1>

  <div class="table-container">
    <table id="dataTable">

      <thead>
        <tr>
          <th onclick="sortTable(0)">
            Name <span class="sort-icon">⇅</span>
          </th>

          <th onclick="sortTable(1)">
            Age <span class="sort-icon">⇅</span>
          </th>

          <th onclick="sortTable(2)">
            Department <span class="sort-icon">⇅</span>
          </th>

          <th onclick="sortTable(3)">
            Salary <span class="sort-icon">⇅</span>
          </th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Alice Johnson</td>
          <td>28</td>
          <td>Design</td>
          <td>4500</td>
        </tr>

        <tr>
          <td>Michael Smith</td>
          <td>35</td>
          <td>Development</td>
          <td>6200</td>
        </tr>

        <tr>
          <td>Emma Wilson</td>
          <td>24</td>
          <td>Marketing</td>
          <td>3900</td>
        </tr>

        <tr>
          <td>David Brown</td>
          <td>31</td>
          <td>HR</td>
          <td>5100</td>
        </tr>

        <tr>
          <td>Sophia Davis</td>
          <td>29</td>
          <td>Finance</td>
          <td>5800</td>
        </tr>
      </tbody>

    </table>
  </div>

  <script>
    let sortDirection = true;

    function sortTable(columnIndex) {

      const table = document.getElementById("dataTable");
      const tbody = table.querySelector("tbody");
      const rows = Array.from(tbody.querySelectorAll("tr"));

      rows.sort((a, b) => {

        let cellA = a.children[columnIndex].textContent.trim();
        let cellB = b.children[columnIndex].textContent.trim();

        // Detect numbers
        const isNumber =
          !isNaN(cellA) && !isNaN(cellB);

        if(isNumber){
          cellA = Number(cellA);
          cellB = Number(cellB);
        }

        if(cellA < cellB){
          return sortDirection ? -1 : 1;
        }

        if(cellA > cellB){
          return sortDirection ? 1 : -1;
        }

        return 0;
      });

      sortDirection = !sortDirection;

      rows.forEach(row => tbody.appendChild(row));
    }
  </script>

</body>
</html>
